[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-to-simulation"
version = "0.1.0"
description = "AI-powered real-world traffic digital twin"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"